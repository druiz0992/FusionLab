[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fusionlab"
version = "0.1.0"
description = "Sensor acquisition and localization experiments"
requires-python = ">=3.12"
dependencies = ["protobuf>=4.21,<7"]

[project.optional-dependencies]
benchmark = ["PyYAML>=6,<7", "numpy>=1.26", "scipy>=1.11", "opencv-python-headless>=4.6", "matplotlib>=3.6"]
dev = ["black>=26.10,<27"]
plot = ["matplotlib>=3.6"]
live = ["Pillow>=9"]
odometry = ["opencv-python-headless>=4.6", "numpy>=1.26", "scipy>=1.11"]
tracking = ["opencv-python-headless>=4.6", "numpy>=1.26"]
calibration = ["opencv-python-headless>=4.6", "numpy>=1.26"]
viewer = ["rerun-sdk==0.39.0"]

[project.scripts]
sensor-stream = "sensor_stream.cli:main"
fusionlab = "fusionlab.cli:main"
fusion-viewer = "fusion_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sensor_stream = ["py.typed", "protocol/proto/*.proto"]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = 'imu_pb2\.py$'
